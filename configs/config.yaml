app:
  mode: "paper"
  tick_interval_ms: 100

logging:
  level: "info"
  file_path: "./logs/engine.log"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true
  s3_enabled: true
  s3_bucket: "${RECORDER_S3_BUCKET}"
  s3_region: "${RECORDER_S3_REGION}"
  s3_prefix: "logs/engine/"

markets:
  - symbol: "BTC"
    chainlink_feed_id: "0x00039d9e45394f473ab1f050a1b963e6b05351e52d71e507509ada0c95ed75b8"
    binance_symbol: "BTCUSDT"
    polymarket:
      prefix: "btc-updown-"
      windows: [5, 15]
  - symbol: "ETH"
    chainlink_feed_id: "0x000362205e10b3a147d02792eccee483dca6c7b44ecce7012cb8c6e0b68b3ae9"
    binance_symbol: "ETHUSDT"
    polymarket:
      prefix: "eth-updown-"
      windows: [5, 15]
  - symbol: "SOL"
    chainlink_feed_id: "0x0003b778d3f6b2ac4991302b89cb313f99a42467d6c9c5f96f57c29c0d2bc24f"
    binance_symbol: "SOLUSDT"
    polymarket:
      prefix: "sol-updown-"
      windows: [5, 15]

chainlink:
  rest_url: "https://api.dataengine.chain.link"
  ws_url: "wss://ws.dataengine.chain.link"
  api_key: "${CHAINLINK_API_KEY}"
  api_secret: "${CHAINLINK_API_SECRET}"
  ws_ha: true
  ws_max_reconnect: 10

binance_spot:
  ws_url: "wss://stream.binance.com:9443"
  rest_url: "https://api.binance.com"
  depth_speed: "100ms"
  depth_limit: 20

binance_perps:
  ws_url: "wss://fstream.binance.com"

polymarket:
  clob_url: "https://clob.polymarket.com"
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  gamma_url: "https://gamma-api.polymarket.com"
  api_key: "${POLYMARKET_API_KEY}"
  api_secret: "${POLYMARKET_API_SECRET}"
  passphrase: "${POLYMARKET_PASSPHRASE}"
  private_key: "${POLYMARKET_PRIVATE_KEY}"

  tracker:
    enabled: true
    pre_schedule_windows: 3
    custom_features: true

strategy:
  enabled: true
  mode: "live"
  entry_window_min_secs: 30
  entry_window_max_secs: 90
  min_pm_confidence:
    BTC: 0.95
    ETH: 0.95
    SOL: 0.95
  max_cl_binance_divergence_pct:
    BTC: 0.05
    ETH: 0.05
    SOL: 0.05
  depth_safety_multiplier:
    BTC: 3.0
    ETH: 3.0
    SOL: 3.0
  min_gap_pct:
    BTC: 0.02
    ETH: 0.02
    SOL: 0.02
  min_depth:
    BTC: 0.5
    ETH: 50.0
    SOL: 50.0
  max_shares_per_trade: 200
  max_concurrent_positions: 5
  trade_size_usd: 1.0

execution:
  url: "http://localhost:3000"
  timeout_ms: 5000
  redeem_delay_secs: 30
  redeem_poll_interval_secs: 5
  redeem_timeout_secs: 120
  redeem_max_retries: 5
  redeem_loop_interval_secs: 15

risk:
  kill_switch: false
  max_daily_losses: 2
  max_order_size: 100.0
  chainlink_stale_ms: 300
  binance_stale_ms: 2000
  polymarket_stale_ms: 2000
  max_move_30s_pct: 0.5
  max_move_60s_pct: 1.0
  recovery_cooldown_sec: 5

persistence:
  enabled: true
  ndjson_path: "./logs/events"
  rotation_interval: 3600
  flush_interval_ms: 1000
  s3_enabled: true
  s3_bucket: "${RECORDER_S3_BUCKET}"
  s3_region: "${RECORDER_S3_REGION}"
  s3_prefix: "logs/events/"

sampler:
  enabled: true
  output_path: "./logs/snapshots.ndjson"
  interval_secs: 2

recorder:
  enabled: true
  output_dir: "./logs/recorder"
  interval_secs: 1
  s3_enabled: true
  s3_bucket: "${RECORDER_S3_BUCKET}"
  s3_region: "${RECORDER_S3_REGION}"
  s3_prefix: "logs/recorder/"

http_server:
  enabled: true
  listen_addr: ":8080"
  read_timeout_ms: 5000
  write_timeout_ms: 10000
