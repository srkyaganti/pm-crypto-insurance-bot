app:
  mode: "paper"
  tick_interval_ms: 100

logging:
  level: "debug"
  file_path: "./logs/engine.log"
  max_size_mb: 100
  max_backups: 10
  max_age_days: 30
  compress: true

markets:
  - symbol: "BTC"
    chainlink_feed_id: "0x00039d9e45394f473ab1f050a1b963e6b05351e52d71e507509ada0c95ed75b8"
    binance_symbol: "BTCUSDT"
    polymarket:
      prefix: "btc-updown-"
      windows: [5, 15]
  - symbol: "ETH"
    chainlink_feed_id: "0x000362205e10b3a147d02792eccee483dca6c7b44ecce7012cb8c6e0b68b3ae9"
    binance_symbol: "ETHUSDT"
    polymarket:
      prefix: "eth-updown-"
      windows: [5, 15]
  - symbol: "SOL"
    chainlink_feed_id: "0x0003b778d3f6b2ac4991302b89cb313f99a42467d6c9c5f96f57c29c0d2bc24f"
    binance_symbol: "SOLUSDT"
    polymarket:
      prefix: "sol-updown-"
      windows: [5, 15]
  - symbol: "XRP"
    chainlink_feed_id: "0x0003c16c6aed42294f5cb4741f6e59ba2d728f0eae2eb9e6d3f555808c59fc45"
    binance_symbol: "XRPUSDT"
    polymarket:
      prefix: "xrp-updown-"
      windows: [5, 15]
  - symbol: "DOGE"
    chainlink_feed_id: "0x000356ca64d3b32135e17dc0dc721a645bf50d0303be8ceb2cdca0a50bab8fdc"
    binance_symbol: "DOGEUSDT"
    polymarket:
      prefix: "doge-updown-"
      windows: [5, 15]
  - symbol: "BNB"
    chainlink_feed_id: "0x000335fd3f3ffa06cfd9297b97367f77145d7a5f132e84c736cc471dd98621fe"
    binance_symbol: "BNBUSDT"
    polymarket:
      prefix: "bnb-updown-"
      windows: [5, 15]

chainlink:
  rest_url: "https://api.dataengine.chain.link"
  ws_url: "wss://ws.dataengine.chain.link"
  api_key: "${CHAINLINK_API_KEY}"
  api_secret: "${CHAINLINK_API_SECRET}"
  ws_ha: true
  ws_max_reconnect: 10

binance_spot:
  ws_url: "wss://stream.binance.com:9443"
  rest_url: "https://api.binance.com"
  depth_speed: "100ms"
  depth_limit: 20

binance_perps:
  ws_url: "wss://fstream.binance.com"

polymarket:
  clob_url: "https://clob.polymarket.com"
  ws_url: "wss://ws-subscriptions-clob.polymarket.com/ws/market"
  gamma_url: "https://gamma-api.polymarket.com"
  api_key: "${POLYMARKET_API_KEY}"
  api_secret: "${POLYMARKET_API_SECRET}"
  passphrase: "${POLYMARKET_PASSPHRASE}"
  private_key: "${POLYMARKET_PRIVATE_KEY}"

  tracker:
    enabled: true
    pre_schedule_windows: 3
    custom_features: true

risk:
  kill_switch: false
  max_daily_losses: 2
  max_order_size: 100.0
  chainlink_stale_ms: 300
  binance_stale_ms: 2000
  polymarket_stale_ms: 2000
  max_move_30s_pct: 0.5
  max_move_60s_pct: 1.0
  recovery_cooldown_sec: 5

persistence:
  enabled: true
  ndjson_path: "./logs/events"
  rotation_interval: 3600
  flush_interval_ms: 1000
  s3_enabled: false
  s3_bucket: ""
  s3_region: "us-east-1"
  s3_prefix: "pm-insurance-bot/"
